name: release

# Publishes a release: runs the tests, puts a universal (Apple Silicon + Intel)
# binary on a GitHub Release, and updates the formula in satanmoo/homebrew-tap.
# Start it from Actions > release > Run workflow with a version such as 1.2.0,
# with `gh workflow run release -f version=1.2.0`, or by pushing a tag v1.2.0.
# See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (no leading v)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.2.3 (got: $v)"
            exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::release v$v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: swift test

      - name: Build universal binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '// Written by the release workflow.\npublic let version = "%s"\n' "$VERSION" \
            > Sources/EbookCapture/Version.swift
          swift build -c release --arch arm64 --arch x86_64

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The output folder differs between toolchains, so ask SwiftPM
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/ebook-capture"
          lipo -info "$bin"
          test "$("$bin" --version)" = "$VERSION"
          archive="ebook-capture-v$VERSION-macos.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bin")" ebook-capture
          shasum -a 256 "$archive" | tee checksums.txt
          echo "sha256=$(cut -d ' ' -f 1 checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "ebook-capture-v$VERSION-macos.tar.gz" checksums.txt \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

  update-tap:
    # GITHUB_TOKEN only reaches this repository, so pushing to the tap needs
    # a token of its own. If this job fails, fix the token and use
    # "Re-run failed jobs"; the release above is kept.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Add it (docs/RELEASING.md), then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: source

      - uses: actions/checkout@v5
        with:
          repository: satanmoo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          mkdir -p tap/Formula
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA256/g" \
            source/packaging/homebrew/ebook-capture.rb > tap/Formula/ebook-capture.rb
          cd tap
          git add Formula/ebook-capture.rb
          if git diff --cached --quiet; then
            echo "Formula is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ebook-capture $VERSION"
          git push
